name: Bug Report
description: Create a report to help us fix a bug or issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with OtoWall!
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Windows 11 23H2, Ubuntu 24.04, macOS Sonoma
    validations:
      required: true
  - type: dropdown
    id: playback_source
    attributes:
      label: Playback Source
      options:
        - Local (Windows SMTC)
        - Local (Linux MPRIS)
        - Local (macOS AppleScript)
        - Spotify Web API
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please paste logs from `%APPDATA%\otowall\logs\otowall.log` (run with `-v`).
      render: shell
