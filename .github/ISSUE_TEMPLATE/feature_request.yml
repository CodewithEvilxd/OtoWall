name: Feature Request
description: Suggest an idea or enhancement for OtoWall.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new wallpaper layouts, player integrations, or performance improvements!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What would you like to see added?
    validations:
      required: true
  - type: textarea
    id: solution-context
    attributes:
      label: Proposed Solution or Alternatives
      description: Any specific ideas or mockups on how this could work?
